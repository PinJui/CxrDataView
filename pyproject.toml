[tool.poetry]
name = "cxr-dataset-manager"
version = "0.2.0"
description = "CXR ML dataset 管理系統：把散落各處的 original-set 組成可重現、可溯源的 manual-set"
authors = ["Jeffery Huang <jefferyhuang@sgsc.ai>"]
readme = "README.md"
packages = [{ include = "cxr_dataset_manager" }]

[tool.poetry.dependencies]
python = "^3.12"
sqlalchemy = "^2.0.52"
psycopg = { extras = ["binary"], version = "^3.2" }
pydantic = "^2.13"
pydantic-settings = "^2.15"
typer = "^0.27"
rich = "^14.0"
pyyaml = "^6.0"
blake3 = "^1.0"
boto3 = "^1.43"
pillow = "^11.0"
opencv-python = "^5.0.0.93"
tqdm = "^4.70.0"

[tool.poetry.group.parquet.dependencies]
# 只有 scripts/tools/ 的匯入腳本需要；核心不依賴它們
pandas = "^2.2"
pyarrow = "^18.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.poetry.scripts]
cxr = "cxr_dataset_manager.cli.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# typer 的官方寫法就是把 typer.Option(...) / typer.Argument(...) 放在參數預設值裡
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# 攔截籠統的例外在這些地方是刻意的，不是漏寫：
#   cli/      打錯一個字不該讓整個 explore session 掉出去；main() 把例外收成一行
#   storage   alive() 只是探活，連不上就是連不上
#   tools/    匯入腳本要在 Ctrl-C（BaseException）時把 S3 與 DB 一起回滾，見 fixed_issues #10
#   tests/    conftest 用它判斷開發資料庫在不在
"cxr_dataset_manager/cli/*" = ["BLE001"]
"cxr_dataset_manager/storage.py" = ["BLE001"]
"scripts/tools/*" = ["BLE001"]
"tests/*" = ["BLE001"]
